/* API-shaped helpers — swap bodies for fetch() later */
const api = {
  categoryById: (id) => data.categories.find((c) => c.id === id),
  searchCourses: ({ q, category, location, format, month }) => {
    const term = q.trim().toLowerCase();
    return data.courses
      .map((c) => {
        const cat = api.categoryById(c.category);
        const text = `${c.title} ${c.desc} ${cat.name}`.toLowerCase();
        if (term && !term.split(/\s+/).every((w) => text.includes(w))) return null;
        if (category && c.category !== category) return null;
        const matching = c.sessions.filter((x) =>
          (!location || x.location === location) &&
          (!format || x.format === format) &&
          (!month || x.date.startsWith(month)));
        if (!matching.length) return null;
        return { ...c, next: matching[0] };
      })
      .filter(Boolean);
  },
};

            <p className="text-[18px] leading-relaxed text-white/70">From AI fundamentals to strategy, governance and transformation, develop the capabilities needed to lead confidently in an AI-driven workplace.</p>
            <ol className="mt-8 flex flex-wrap items-center gap-y-3 text-[13.5px]" aria-label="AI capability pathway">
              {steps.map((st, i) => (
                <li key={st} className="flex items-center">
                  <span className="rounded-full bg-white/[0.07] px-3 py-1.5 text-white/85">{st}</span>
                  {i < steps.length - 1 && <span className="mx-1.5 h-px w-4 bg-brass/60" aria-hidden="true" />}
                </li>
              ))}
            </ol>
          </div>
        </div>

        <div className="mt-14 grid gap-px overflow-hidden rounded-[18px] border border-white/10 bg-white/10 sm:grid-cols-2 lg:mt-20 lg:grid-cols-3">
          {data.aiTracks.map((t) => (
            <a key={t.title} href="#" className="group flex flex-col bg-navy-deep p-7 transition-colors hover:bg-navy sm:p-8">
              <div className="flex items-center justify-between text-[13.5px] text-white/55">
                <span>{t.level}</span><span className="inline-flex items-center gap-1.5"><Icon name="clock" size={14} />{t.duration}</span>
              </div>
              <h3 className="mt-8 font-serif text-[28px] leading-tight">{t.title}</h3>
              <p className="mt-3 text-[15px] leading-relaxed text-white/65">{t.desc}</p>
              <span className="mt-8 inline-flex items-center gap-2 text-[14.5px] font-semibold text-brass">
                Explore programme <Icon name="arrow" size={16} className="transition-transform group-hover:translate-x-1" />
              </span>
            </a>
          ))}
        </div>

        <div className="mt-10 flex flex-col items-start justify-between gap-6 rounded-[18px] border border-white/10 bg-white/[0.04] p-6 sm:flex-row sm:items-center sm:p-8">
          <div className="flex items-start gap-4">
            <span className="grid h-11 w-11 shrink-0 place-items-center rounded-full bg-brass text-navy-deep"><Icon name="shield" size={20} /></span>
            <div>
              <p className="text-[17px] font-semibold">Rolling out AI to a whole team?</p>
              <p className="mt-1 text-[15px] text-white/65">We assess current capability, then design a tailored programme across all levels.</p>
            </div>
          </div>
          <Button href="#contact" className="w-full sm:w-auto">Plan an AI programme</Button>
        </div>
      </Container>
    </section>
  );
}

          </div>
          <div className="relative min-h-[260px] bg-navy">
            <svg viewBox="0 0 400 360" className="absolute inset-0 h-full w-full" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Map of LondonBTA training locations">
              <rect width="400" height="360" fill="#0F2238" />
              {[...Array(18)].map((_, r) => [...Array(22)].map((_, c) => {

                const land = Math.sin(c * 0.55 + r * 0.3) + Math.cos(r * 0.7 - c * 0.2) > 0.3;
                return land ? <circle key={r + '-' + c} cx={x} cy={y} r="1.6" fill="#fff" opacity=".18" /> : null;
              }))}
              {[[118, 98, 'London'], [150, 120, 'Paris'], [128, 150, 'Barcelona'], [205, 140, 'Istanbul'], [262, 200, 'Dubai'], [336, 262, 'Kuala Lumpur']].map(([x, y, n], i) => (
                <g key={n}>

                  <text x={x + 12} y={y + 4} fill="#fff" fontSize="12" fontFamily="Schibsted Grotesk, sans-serif" opacity=".85">{n}</text>

              ))}

/* =========================================================
   PAGE
   ========================================================= */
function HomePage() {
  const inputRef = useRef(null);
  const [filters, setFilters] = useState({ q: '', category: '', location: '', format: '', month: '' });
  const [searched, setSearched] = useState(false);

  const focusSearch = () => {
    document.getElementById('courses')?.scrollIntoView({ block: 'start' });
    setTimeout(() => inputRef.current?.focus({ preventScroll: true }), 350);
  };
  const pickCategory = (id) => {
    setFilters({ q: '', category: id, location: '', format: '', month: '' });
    setSearched(true);
    setTimeout(() => document.getElementById('results')?.scrollIntoView({ block: 'start' }), 30);
  };

  return (
    <>
      <Header onSearchClick={focusSearch} />
      <main>
        <Hero onExplore={focusSearch} />
        <CourseSearch inputRef={inputRef} filters={filters} setFilters={setFilters} searched={searched} setSearched={setSearched} />
        <Trust />
        <Categories onPick={pickCategory} />
        <Featured />
        <AISection />
        <ContactCTA />
      </main>
      <Footer />
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<HomePage />);
</script>
